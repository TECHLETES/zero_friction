[build-system]
requires = ["setuptools>=61.0", "wheel", "pip>=26.0,<27.0.0", "uv>=0.9.25,<1.0.0"]
build-backend = "setuptools.build_meta"

[project.urls]
# Replace with the target repository URLs.
Homepage = "https://github.com/TECHLETES/your-repo"
Repository = "https://github.com/TECHLETES/your-repo"
Issues = "https://github.com/TECHLETES/your-repo/issues"

[project]
# Replace project metadata for the target repository.
name = "your-project-name"
version = "0.1.0"
description = "Your project description."
readme = "README.md"
requires-python = ">=3.12,<4.0"
keywords = ["devops", "template", "python"]
authors = [{ name = "Your Name", email = "you@example.com" }]
maintainers = [{ name = "Your Team", email = "team@example.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]

# Core production dependencies required for the application to run.
# Pinned with >= and < to allow patch/minor updates while preventing major version breaks.
# Add only dependencies that are needed for the app to run in production.
dependencies = [
  # Add the target repo's runtime dependencies here.
]

# Optional dependency groups for different environments and use cases.
# Managed by uv (PEP 735 format) and locked in uv.lock for reproducible builds.
# Install with: uv sync (all groups), uv sync --no-group dev (no dev), uv sync --only-group extra (extra only), etc.
[dependency-groups]
# Development and testing dependencies.
# Includes code quality tools, testing frameworks, and development utilities.
# Install with: uv sync (default includes dev) or uv sync --no-group dev to skip
dev = [
  "pre-commit>=4.5.0,<5.0.0",
  "detect-secrets>=1.5.0,<2.0.0",
  "nbstripout>=0.8.0,<1.0.0",
  "ipykernel>=6.29.0,<7.0.0",
  "pytest>=9.0.3,<10.0.0",
  "pytest-cov>=7.0.0,<8.0.0",
  "black>=25.12.0,<27.0.0",
  "mypy>=1.19.0,<2.0.0",
  "ruff>=0.14.0,<1.0.0",
  "beartype>=0.22.0,<1.0.0",
  "pytest-beartype>=0.2.0,<1.0.0",
  "pip-audit>=2.10.0,<3.0.0",
  "rich>=14.2.0,<15.0.0",
  "pyupgrade>=3.15.0,<4.0.0",
  "codespell>=2.2.0,<3.0.0",
  "bandit>=1.7.0,<2.0.0",
  "pydocstyle>=6.3.0,<7.0.0",
  "genbadge[coverage]>=1.1.0,<2.0.0",
  "testcontainers>=4.8.0",
  "pillow~=12.2"
]

# Additional production features and optional components.
# Install with: uv sync --group extra or uv sync --no-group extra
extra = [
  # Add optional production dependencies for the target repo here.
]

[tool.setuptools.packages.find]
where = ["."]
include = [
  # Replace with the target repo's importable packages, e.g. "your_package*".
]
exclude = ["tests*"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest]
minversion = "9.0.3"
addopts = [
  "--strict-markers",
  "--strict-config",
  # Replace with the target repo's coverage package arguments.
  # "--cov=your_package",
  "--cov-report=term-missing",
  "--cov-report=html",
  "--cov-report=xml",
  # Replace with the target repo's beartype-enabled packages when used.
  # "--beartype-packages=your_package",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]

[tool.coverage.run]
source = [
  # Replace with the target repo's production packages.
  # "your_package",
]
omit = [
  "*/__pycache__/*",
  "*/tests/*",
  "*/.venv/*",
  "*/venv/*",
  "*/__init__.py",
  "setup.py",
  # Add any other files you want to exclude from test coverage.
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  "class .*\\bProtocol\\):",
  "@(abc\\.)?abstractmethod",
  "except ImportError",
  "pass",
]

[tool.mypy]
python_version = "3.12"

# ignore_missing_imports for third-party libs without type hints
ignore_missing_imports = true
follow_imports = "silent"

# strictness settings - adjust as needed
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
no_implicit_optional = true
allow_redefinition = true
show_column_numbers = true
pretty = true
warn_unused_configs = true

# enforce typing on own code
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Specify which folders/files to type check.
files = [
  # Replace with the target repo's packages or entry points to type check.
  # "your_package",
]

exclude = '''
(?x)(
    # Adjust these patterns for the target repo.
    ^migrations/
  | ^notebooks/
  | ^tests/
  | ^\.venv/
  | ^venv/
)
'''
plugins = []

[tool.ruff]
target-version = "py312"
line-length = 88
fix = true
respect-gitignore = true
extend-exclude = [
  # Add project-specific exclusions here, e.g. "migrations".
]
lint.dummy-variable-rgx = "^_|^__|^pytest$"

# Enable popular rule sets
lint.select = [
  "E",  # pycodestyle
  "F",  # pyflakes
  "I",  # import sorting
  "B",  # bugbear
  "UP", # pyupgrade
]

# Rules to ignore (common ones)
lint.ignore = [
  "B008", # Do not perform function calls in argument defaults
  "E501", # Line too long (Black handles this)
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101", "B601"]

[tool.pip-audit]
# Centralized CVE/PYSEC exclusions for pip-audit
# Used by both pre-commit hooks and CI workflows via scripts/hooks/run-pip-audit.sh
# See docs/6_pre_commit_troubleshooting.md for explanation of each exclusion
ignore = [
  "CVE-2026-1703", # Path traversal in pip when extracting malicious wheels
]

[tool.uv]
required-version = ">=0.9.25,<1.0.0"
