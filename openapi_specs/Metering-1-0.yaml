            type: string
        - name: startDateTime
          in: query
          description: The start date and time for the consumption data range.
          schema:
            type: string
            format: date-time
        - name: endDateTime
          in: query
          description: The end date and time for the consumption data range.
          schema:
            type: string
            format: date-time
        - name: continuationToken
          in: header
          description: Token for pagination of large result sets.
          schema:
            type: string
        - name: zf-tuuid
          in: header
          description: Tenant ID
          required: true
          schema:
            type: string
            format: uuid
          example:
            Tenant ID: '{{zf-tuuid}}'
        - name: zf-ouuid
          in: header
          description: Organisation ID
          required: true
          schema:
            type: string
            format: uuid
          example:
            Organisation ID: '{{zf-ouuid}}'
      responses:
        '200':
          description: A paged list of consumption values for the specified channel and date range.
