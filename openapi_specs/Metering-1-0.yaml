components:
  schemas:
    AddMeasurementRequest:
      required:
        - endDateTime
        - externalChannelIdentifier
        - meterId
      type: object
      properties:
        startDateTime:
          type: string
          format: date-time
          nullable: true
        endDateTime:
          type: string
          format: date-time
        value:
          type: number
          format: double
        externalChannelIdentifier:
          type: string
          nullable: true
        meterId:
          type: string
          nullable: true
        skipValidation:
          type: boolean
        resolveIssuesManually:
          type: boolean
        readingOrigin:
          type: string
          oneOf:
            - $ref: '#/components/schemas/MeasurementReadingOrigin'
          nullable: true
        readingMethod:
          type: string
          oneOf:
            - $ref: '#/components/schemas/MeasurementReadingMethod'
          nullable: true
    AddressDTO:
      type: object
      properties:
        streetName:
          type: string
        streetNumber:
          type: string
        streetNumberAddition:
          type: string
        postalCode:
          type: string
        buildingName:
          type: string
        locality:
          type: string
        city:
          type: string
        country:
          $ref: '#/components/schemas/CountryCode'
        localizedDisplay:
          type: string
        lineOne:
          type: string
        lineTwo:
          type: string
    AdjacentMeasurementPairsDTO:
      type: object
      properties:
        pairs:
          type: array
          items:
            $ref: '#/components/schemas/MeasurementPairDTO'
          nullable: true
    AggregatedConsumptionsByMeterDTO:
      type: object
      properties:
        meterSerialNumber:
          type: string
          nullable: true
        meterTag:
          type: string
          nullable: true
        utilityType:
          $ref: '#/components/schemas/UtilityType'
        unitOfMeasure:
          $ref: '#/components/schemas/UnitOfMeasure'
        timeOfUse:
          type: string
          nullable: true
        periodStartDate:
          type: string
          format: date-time
          nullable: true
        periodEndDate:
          type: string
          format: date-time
          nullable: true
        propertyGroupId:
          type: string
          nullable: true
        propertyGroupName:
          type: string
          nullable: true
        total:
          type: number
          format: double
    AggregateDetailsDTO:
      type: object
      properties:
        code:
          type: string
        translation:
          type: string
        value:
          type: number
          format: double
          nullable: true
        valueDate:
          type: string
          format: date-time
          nullable: true
    AggregatedServiceConsumptionPerPeriodRequest:
      required:
        - serviceLocationIds
        - groupByPeriod
      type: object
      properties:
        serviceLocationIds:
          type: array
          items:
            type: string
          nullable: true
        groupByPeriod:
          $ref: '#/components/schemas/AggregationFrequency'
    AggregatedServiceConsumptionsByServiceLocationDTO:
