name: Reusable template sync

on:
  workflow_call:
    inputs:
      template_repository:
        description: Template repository in owner/name format
        required: true
        type: string

      template_branch:
        description: Branch in the template repository
        required: false
        default: main
        type: string

      target_branch:
        description: Integration branch that receives the sync PR
        required: true
        type: string

      sync_branch:
        description: Permanent branch that retains template merge ancestry
        required: false
        default: chore/template-sync
        type: string

      config_path:
        description: Path to the template-sync configuration
        required: false
        default: .template-sync.yml
        type: string

      pull_request_title:
        description: Title of the template-sync pull request
        required: false
        default: "chore: sync template"
        type: string

    secrets:
      app_client_id:
        description: Client ID of the Techletes template-sync GitHub App
        required: true

      app_private_key:
        description: Private key of the Techletes template-sync GitHub App
        required: true

permissions:
  contents: read

concurrency:
  group: template-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    name: Synchronize template
    runs-on: ubuntu-latest

    steps:
      - name: Validate repository owners
        shell: bash
        env:
          TEMPLATE_REPOSITORY: ${{ inputs.template_repository }}
          TARGET_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          template_owner="${TEMPLATE_REPOSITORY%%/*}"
          template_name="${TEMPLATE_REPOSITORY#*/}"

          if [[ -z "${template_owner}" ||
                -z "${template_name}" ||
                "${template_owner}" == "${template_name}" ]]; then
            echo "template_repository must use owner/name format." >&2
            exit 1
          fi

          if [[ "${template_owner}" != "${TARGET_OWNER}" ]]; then
            echo "The template and target repositories must belong to the same owner." >&2
            echo "Target owner: ${TARGET_OWNER}" >&2
            echo "Template owner: ${template_owner}" >&2
            exit 1
          fi

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.app_client_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.repository }}
            ${{ inputs.template_repository }}

      - name: Check out target repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sync_branch }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure Git identity
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail

          app_user_id="$(
            gh api "/users/${APP_SLUG}[bot]" --jq '.id'
          )"

          git config user.name "${APP_SLUG}[bot]"
          git config user.email \
            "${app_user_id}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Merge template updates
        id: merge
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TEMPLATE_SYNC_TOKEN: ${{ steps.app-token.outputs.token }}

          TEMPLATE_REPOSITORY: ${{ inputs.template_repository }}
          TEMPLATE_BRANCH: ${{ inputs.template_branch }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          SYNC_BRANCH: ${{ inputs.sync_branch }}
          CONFIG_PATH: ${{ inputs.config_path }}
        run: |
          set -euo pipefail

          if [[ -n "$(git status --porcelain=v1)" ]]; then
            echo "The checkout is not clean." >&2
            git status --short >&2
            exit 1
          fi

          if [[ ! -f "${CONFIG_PATH}" ]]; then
            echo "Template-sync config not found: ${CONFIG_PATH}" >&2
            exit 1
          fi

          mapfile -t managed_paths < <(
            ruby -ryaml -e '
              config_path = ENV.fetch("CONFIG_PATH")

              config = YAML.safe_load(
                File.read(config_path),
                permitted_classes: [],
                permitted_symbols: [],
                aliases: false
              )

              unless config.is_a?(Hash)
                abort "#{config_path} must contain a YAML mapping"
              end

              source = config.fetch("source", {})
              target = config.fetch("target", {})
              paths = config.fetch("paths", [])

              expected = {
                "source.repository" => [
                  source["repository"],
                  ENV.fetch("TEMPLATE_REPOSITORY")
                ],
                "source.branch" => [
                  source["branch"],
                  ENV.fetch("TEMPLATE_BRANCH")
                ],
                "target.branch" => [
                  target["branch"],
                  ENV.fetch("TARGET_BRANCH")
                ],
                "target.sync_branch" => [
                  target["sync_branch"],
                  ENV.fetch("SYNC_BRANCH")
                ]
              }

              expected.each do |name, (actual, wanted)|
                unless actual == wanted
                  abort "#{name} must be #{wanted.inspect}; got #{actual.inspect}"
                end
              end

              unless paths.is_a?(Array) &&
                     !paths.empty? &&
                     paths.all? { |path| path.is_a?(String) && !path.empty? }
                abort "paths must be a non-empty list of strings"
              end

              paths.each do |path|
                normalized = path.sub(%r{\A\./}, "")

                if normalized.empty? ||
                   normalized.start_with?("/") ||
                   normalized.split("/").include?("..")
                  abort "Unsafe managed path: #{path.inspect}"
                end

                puts normalized
              end
            '
          )

          if ((${#managed_paths[@]} == 0)); then
            echo "No managed template paths were configured." >&2
            exit 1
          fi

          is_managed_path() {
            local path="$1"
            local pattern
            local normalized

            path="${path#./}"

            for pattern in "${managed_paths[@]}"; do
              normalized="${pattern#./}"

              # The right-hand operand is deliberately unquoted so Bash applies
              # patterns such as .devcontainer/** and scripts/**.
              if [[ "${path}" == ${normalized} ]]; then
                return 0
              fi

              if [[ "${normalized}" == */ &&
                    "${path}" == "${normalized}"* ]]; then
                return 0
              fi
            done

            return 1
          }

          normalized_config_path="${CONFIG_PATH#./}"

          if is_managed_path "${normalized_config_path}"; then
            echo "${CONFIG_PATH} must remain target-owned." >&2
            echo "Remove any allowlist entry that matches it." >&2
            exit 1
          fi

          echo "Managed template paths:"
          printf '  - %s\n' "${managed_paths[@]}"

          target_repository="${GITHUB_REPOSITORY}"

          template_url="https://x-access-token:${TEMPLATE_SYNC_TOKEN}@github.com/${TEMPLATE_REPOSITORY}.git"
          origin_url="https://x-access-token:${TEMPLATE_SYNC_TOKEN}@github.com/${target_repository}.git"

          git remote set-url origin "${origin_url}"

          if git remote get-url template >/dev/null 2>&1; then
            git remote set-url template "${template_url}"
          else
            git remote add template "${template_url}"
          fi

          git remote set-url --push template DISABLED

          git fetch origin \
            "${TARGET_BRANCH}" \
            "${SYNC_BRANCH}" \
            --prune

          git fetch template \
            "${TEMPLATE_BRANCH}" \
            --prune

          remote_sync_sha="$(
            git rev-parse "origin/${SYNC_BRANCH}"
          )"

          if [[ "$(git rev-parse HEAD)" != "${remote_sync_sha}" ]]; then
            echo "Local sync branch does not match origin/${SYNC_BRANCH}." >&2
            exit 1
          fi

          echo "Merging origin/${TARGET_BRANCH} into ${SYNC_BRANCH}..."

          set +e
          git merge \
            --no-edit \
            --no-ff \
            "origin/${TARGET_BRANCH}"
          target_merge_status=$?
          set -e

          if ((target_merge_status != 0)); then
            target_merge_head="$(
              git rev-parse --verify MERGE_HEAD 2>/dev/null || true
            )"

            if [[ -n "${target_merge_head}" ]]; then
              echo "The target branch conflicts with ${SYNC_BRANCH}." >&2
              echo "Resolve this merge manually on ${SYNC_BRANCH} first." >&2

              {
                echo "## Target-branch merge conflict"
                echo
                echo "\`${TARGET_BRANCH}\` conflicts with permanent branch"
                echo "\`${SYNC_BRANCH}\`."
                echo
                echo "Resolve this merge manually before rerunning the workflow."
              } >> "${GITHUB_STEP_SUMMARY}"

              git merge --abort 2>/dev/null || true
            else
              echo "Merging origin/${TARGET_BRANCH} failed before Git created merge state." >&2
              echo "git merge exit status: ${target_merge_status}" >&2
              git status --short >&2 || true
            fi

            exit 1
          fi

          pre_template_head="$(git rev-parse HEAD)"
          template_ref="template/${TEMPLATE_BRANCH}"
          template_sha="$(git rev-parse "${template_ref}")"
          template_short_sha="$(git rev-parse --short "${template_ref}")"

          template_merged="false"
          manual_resolution_required="false"
          managed_conflict_text=""

          if git merge-base --is-ancestor "${template_ref}" HEAD; then
            echo "${TEMPLATE_REPOSITORY}@${template_short_sha} is already merged."
          else
            echo "Merging ${TEMPLATE_REPOSITORY}@${template_short_sha}..."

            set +e
            git merge \
              --allow-unrelated-histories \
              --no-commit \
              --no-ff \
              "${template_ref}"
            template_merge_status=$?
            set -e

            merge_head="$(
              git rev-parse --verify MERGE_HEAD 2>/dev/null || true
            )"

            if [[ -z "${merge_head}" ]]; then
              echo "Template merge failed before Git created merge state." >&2
              echo "git merge exit status: ${template_merge_status}" >&2
              git status --short >&2 || true

              {
                echo "## Template merge failed"
                echo
                echo "Git did not create \`MERGE_HEAD\` while merging"
                echo "\`${TEMPLATE_REPOSITORY}@${template_short_sha}\`."
                echo
                echo "The sync branch was not pushed and no template commit was recorded."
              } >> "${GITHUB_STEP_SUMMARY}"

              exit 1
            fi

            if [[ "${merge_head}" != "${template_sha}" ]]; then
              echo "MERGE_HEAD does not match the expected template commit." >&2
              echo "Expected: ${template_sha}" >&2
              echo "Actual:   ${merge_head}" >&2
              git merge --abort 2>/dev/null || true
              exit 1
            fi

            # Restore all unmanaged paths to the state immediately before the
            # template merge. --no-renames ensures both sides of a rename are
            # evaluated independently.
            while IFS= read -r -d '' path; do
              if is_managed_path "${path}"; then
                continue
              fi

              echo "Restoring unmanaged path: ${path}"

              if git cat-file -e "${pre_template_head}:${path}" 2>/dev/null; then
                git restore \
                  --source="${pre_template_head}" \
                  --staged \
                  --worktree \
                  -- "${path}"
              else
                git rm \
                  -rf \
                  --cached \
                  --ignore-unmatch \
                  -- "${path}" >/dev/null 2>&1 || true

                rm -rf -- "${path}"
              fi
            done < <(
              {
                git diff \
                  --name-only \
                  --no-renames \
                  -z \
                  --cached

                git diff \
                  --name-only \
                  --no-renames \
                  -z

                git diff \
                  --name-only \
                  --no-renames \
                  --diff-filter=U \
                  -z
              } | sort -zu
            )

            mapfile -d '' -t managed_conflicts < <(
              git diff \
                --name-only \
                --no-renames \
                --diff-filter=U \
                -z
            )

            if ((${#managed_conflicts[@]} > 0)); then
              manual_resolution_required="true"

              echo "Managed template conflicts require manual reconciliation:"
              printf '  - %s\n' "${managed_conflicts[@]}"

              # An unresolved index cannot be pushed. Temporarily retain the
              # target version, complete the real merge commit, then open a
              # draft PR that clearly records what must be reconciled.
              for path in "${managed_conflicts[@]}"; do
                managed_conflict_text+="${path}"$'\n'

                echo "Temporarily retaining target version for: ${path}"

                if git cat-file -e "${pre_template_head}:${path}" 2>/dev/null; then
                  git restore \
                    --source="${pre_template_head}" \
                    --staged \
                    --worktree \
                    -- "${path}"
                else
                  git rm \
                    -rf \
                    --cached \
                    --ignore-unmatch \
                    -- "${path}" >/dev/null 2>&1 || true

                  rm -rf -- "${path}"
                fi
              done

              {
                echo "## Manual template reconciliation required"
                echo
                echo "The target versions were retained temporarily for these"
                echo "allowlisted conflicts:"
                echo

                for path in "${managed_conflicts[@]}"; do
                  echo "- \`${path}\`"
                done

                echo
                echo "A draft PR will be opened."
                echo
                echo "Reconcile these files on \`${SYNC_BRANCH}\`, commit and push"
                echo "the result, then remove the reconciliation marker from the"
                echo "PR description and mark the PR ready for review."
                echo
                echo "Template commit: \`${template_sha}\`"
              } >> "${GITHUB_STEP_SUMMARY}"
            fi

            if ((template_merge_status != 0)); then
              echo "All conflicts were resolved to a committed temporary state."
            fi

            remaining_merge_head="$(
              git rev-parse --verify MERGE_HEAD 2>/dev/null || true
            )"

            if [[ "${remaining_merge_head}" != "${template_sha}" ]]; then
              echo "Template merge state was lost before commit." >&2
              echo "Expected MERGE_HEAD: ${template_sha}" >&2
              echo "Actual MERGE_HEAD:   ${remaining_merge_head:-<missing>}" >&2
              git merge --abort 2>/dev/null || true
              exit 1
            fi

            git add -A

            if git ls-files -u | grep -q .; then
              echo "Unresolved merge entries remain after conflict filtering." >&2
              git ls-files -u >&2
              git merge --abort 2>/dev/null || true
              exit 1
            fi

            git commit \
              --allow-empty \
              -m "chore: sync template ${template_short_sha}"

            merge_commit="$(git rev-parse HEAD)"
            first_parent="$(git rev-parse "${merge_commit}^1")"
            second_parent="$(
              git rev-parse "${merge_commit}^2" 2>/dev/null || true
            )"

            if [[ "${first_parent}" != "${pre_template_head}" ||
                  "${second_parent}" != "${template_sha}" ]]; then
              echo "Template synchronization did not create the expected merge commit." >&2
              echo "Expected first parent:  ${pre_template_head}" >&2
              echo "Actual first parent:    ${first_parent}" >&2
              echo "Expected second parent: ${template_sha}" >&2
              echo "Actual second parent:   ${second_parent:-<missing>}" >&2
              exit 1
            fi

            unmanaged_result_paths=()

            while IFS= read -r -d '' path; do
              if ! is_managed_path "${path}"; then
                unmanaged_result_paths+=("${path}")
              fi
            done < <(
              git diff \
                --name-only \
                --no-renames \
                -z \
                "${pre_template_head}" \
                "${merge_commit}" \
                --
            )

            if ((${#unmanaged_result_paths[@]} > 0)); then
              echo "Template merge changed paths outside the allowlist:" >&2
              printf '  - %s\n' "${unmanaged_result_paths[@]}" >&2
              exit 1
            fi

            if ! git merge-base \
              --is-ancestor \
              "${template_sha}" \
              "${merge_commit}"; then
              echo "Template commit is not retained in sync-branch ancestry." >&2
              exit 1
            fi

            template_merged="true"
          fi

          current_head="$(git rev-parse HEAD)"

          if [[ "${current_head}" != "${remote_sync_sha}" ]]; then
            push_required="true"
          else
            push_required="false"
          fi

          tree_diff_required="false"

          if ! git diff \
            --quiet \
            "origin/${TARGET_BRANCH}" \
            HEAD \
            --; then
            tree_diff_required="true"
          fi

          # Preserve an existing draft reconciliation PR across reruns. This
          # matters because the template SHA is already in the branch ancestry
          # after the first run, so a later run would otherwise forget that
          # manual reconciliation is still outstanding.
          existing_manual_pr="false"

          existing_pr_body="$(
            gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --head "${SYNC_BRANCH}" \
              --base "${TARGET_BRANCH}" \
              --state open \
              --json body \
              --jq '.[0].body // empty'
          )"

          if grep -Fq \
            '<!-- template-sync-manual-reconciliation -->' \
            <<< "${existing_pr_body}"; then
            existing_manual_pr="true"
          fi

          if [[ "${tree_diff_required}" == "true" ||
                "${manual_resolution_required}" == "true" ||
                "${existing_manual_pr}" == "true" ]]; then
            pr_required="true"
          else
            pr_required="false"
          fi

          {
            echo "push_required=${push_required}"
            echo "pr_required=${pr_required}"
            echo "template_merged=${template_merged}"
            echo "template_sha=${template_sha}"
            echo "template_short_sha=${template_short_sha}"
            echo "manual_resolution_required=${manual_resolution_required}"
            echo "existing_manual_pr=${existing_manual_pr}"

            echo "managed_conflicts<<MANAGED_CONFLICTS_EOF"
            printf '%s' "${managed_conflict_text}"
            echo "MANAGED_CONFLICTS_EOF"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "## Template synchronization"
            echo
            echo "- Target repository: \`${GITHUB_REPOSITORY}\`"
            echo "- Target branch: \`${TARGET_BRANCH}\`"
            echo "- Permanent sync branch: \`${SYNC_BRANCH}\`"
            echo "- Template: \`${TEMPLATE_REPOSITORY}@${template_short_sha}\`"
            echo "- Template merge created: \`${template_merged}\`"
            echo "- Manual reconciliation required: \`${manual_resolution_required}\`"
            echo "- Existing reconciliation marker: \`${existing_manual_pr}\`"
            echo "- Sync branch push required: \`${push_required}\`"
            echo "- Pull request required: \`${pr_required}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Push permanent sync branch
        if: steps.merge.outputs.push_required == 'true'
        shell: bash
        env:
          SYNC_BRANCH: ${{ inputs.sync_branch }}
        run: |
          set -euo pipefail

          git push origin \
            "HEAD:refs/heads/${SYNC_BRANCH}"

      - name: Open or update template-sync pull request
        if: steps.merge.outputs.pr_required == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

          TARGET_BRANCH: ${{ inputs.target_branch }}
          SYNC_BRANCH: ${{ inputs.sync_branch }}
          TEMPLATE_REPOSITORY: ${{ inputs.template_repository }}
          TEMPLATE_BRANCH: ${{ inputs.template_branch }}
          TEMPLATE_SHA: ${{ steps.merge.outputs.template_sha }}

          MANUAL_RESOLUTION_REQUIRED: ${{ steps.merge.outputs.manual_resolution_required }}
          EXISTING_MANUAL_PR: ${{ steps.merge.outputs.existing_manual_pr }}
          MANAGED_CONFLICTS: ${{ steps.merge.outputs.managed_conflicts }}

          PR_TITLE: ${{ inputs.pull_request_title }}
        run: |
          set -euo pipefail

          existing_pr_json="$(
            gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --head "${SYNC_BRANCH}" \
              --base "${TARGET_BRANCH}" \
              --state open \
              --json number,isDraft,body \
              --jq '.[0] // empty'
          )"

          existing_pr=""
          existing_is_draft="false"
          existing_body=""

          if [[ -n "${existing_pr_json}" ]]; then
            existing_pr="$(
              jq -r '.number' <<< "${existing_pr_json}"
            )"

            existing_is_draft="$(
              jq -r '.isDraft' <<< "${existing_pr_json}"
            )"

            existing_body="$(
              jq -r '.body // ""' <<< "${existing_pr_json}"
            )"
          fi

          standard_body="$(
            cat <<EOF
          Synchronizes the approved files from
          \`${TEMPLATE_REPOSITORY}/${TEMPLATE_BRANCH}\` into
          \`${TARGET_BRANCH}\`.

          Template commit: \`${TEMPLATE_SHA}\`

          This pull request must be **squash-merged**.

          Do not delete, rebase, reset or force-push the permanent
          \`${SYNC_BRANCH}\` branch. It retains the template merge ancestry used
          by future synchronization runs.
          EOF
          )"

          if [[ "${MANUAL_RESOLUTION_REQUIRED}" == "true" ]]; then
            conflict_list=""

            while IFS= read -r path; do
              [[ -z "${path}" ]] && continue
              conflict_list+="- \`${path}\`"$'\n'
            done <<< "${MANAGED_CONFLICTS}"

            pr_body="$(
              cat <<EOF
          <!-- template-sync-manual-reconciliation -->
          ## Manual template reconciliation required

          The workflow encountered allowlisted merge conflicts. It retained the
          target versions temporarily so it could create and push a valid
          two-parent template merge commit.

          Reconcile these files manually:

          ${conflict_list}
          Checkout and update the permanent branch:

          \`\`\`bash
          git fetch origin
          git switch ${SYNC_BRANCH}
          git pull --ff-only origin ${SYNC_BRANCH}
          \`\`\`

          Compare a target file with the incorporated template commit:

          \`\`\`bash
          git diff HEAD ${TEMPLATE_SHA} -- path/to/file
          git show ${TEMPLATE_SHA}:path/to/file
          \`\`\`

          Commit and push the reconciled versions:

          \`\`\`bash
          git add <resolved-files>
          git commit -m "chore: reconcile template conflicts"
          git push origin ${SYNC_BRANCH}
          \`\`\`

          After reconciliation:

          1. Remove this manual-reconciliation section, including its hidden
             marker.
          2. Mark the pull request ready for review.
          3. Validate the application and CI.
          4. Squash-merge the pull request without deleting
             \`${SYNC_BRANCH}\`.

          ${standard_body}
          EOF
            )"
          elif [[ "${EXISTING_MANUAL_PR}" == "true" &&
                  -n "${existing_body}" ]]; then
            # Do not erase an outstanding reconciliation report during a later
            # rerun. The developer explicitly removes the marker after resolving
            # the listed files.
            pr_body="${existing_body}"
          else
            pr_body="${standard_body}"
          fi

          if [[ -z "${existing_pr}" ]]; then
            create_args=(
              --repo "${GITHUB_REPOSITORY}"
              --base "${TARGET_BRANCH}"
              --head "${SYNC_BRANCH}"
              --title "${PR_TITLE}"
              --body "${pr_body}"
            )

            if [[ "${MANUAL_RESOLUTION_REQUIRED}" == "true" ]]; then
              create_args+=(--draft)
            fi

            gh pr create "${create_args[@]}"
          else
            echo "Updating template-sync PR #${existing_pr}."

            gh pr edit "${existing_pr}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${PR_TITLE}" \
              --body "${pr_body}"

            if [[ "${MANUAL_RESOLUTION_REQUIRED}" == "true" &&
                  "${existing_is_draft}" != "true" ]]; then
              gh pr ready "${existing_pr}" \
                --repo "${GITHUB_REPOSITORY}" \
                --undo
            fi
          fi

      - name: Close obsolete template-sync pull request
        if: steps.merge.outputs.pr_required == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          SYNC_BRANCH: ${{ inputs.sync_branch }}
        run: |
          set -euo pipefail

          existing_pr="$(
            gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --head "${SYNC_BRANCH}" \
              --base "${TARGET_BRANCH}" \
              --state open \
              --json number,body \
              --jq '
                .[]
                | select(
                    (.body // "")
                    | contains(
                        "<!-- template-sync-manual-reconciliation -->"
                      )
                    | not
                  )
                | .number
              ' \
              | head -n 1
          )"

          if [[ -n "${existing_pr}" ]]; then
            gh pr close "${existing_pr}" \
              --repo "${GITHUB_REPOSITORY}" \
              --comment \
              "Closing because the permanent sync branch no longer differs from the target branch."
          fi
