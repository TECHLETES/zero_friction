name: Reconcile template sync branch

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  reconcile:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'chore/template-sync' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out permanent sync branch
        uses: actions/checkout@v6
        with:
          ref: chore/template-sync
          fetch-depth: 0

      - name: Reconcile merged template sync
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main chore/template-sync
          git switch chore/template-sync
          git reset --hard origin/chore/template-sync
          git merge --no-ff --no-edit origin/main
          git push origin HEAD:refs/heads/chore/template-sync
