# .github/workflows/ci.yml

name: CI

on:
  pull_request:
    branches:
      - main
      - staging
  push:
    branches:
      - main
      - staging

permissions:
  contents: write

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run pip-audit
        run: uv run bash scripts/run-pip-audit.sh --progress-spinner off --desc

      - name: Black formatting check
        run: uv run black --check .

      - name: Ruff linting
        run: uv run ruff check . --fix

      - name: isort import sorting check
        run: uv run isort . --check-only --profile=black

      - name: Type checking with mypy
        run: uv run mypy . --config-file=pyproject.toml

      - name: Run pyupgrade
        run: uv run pyupgrade --py312-plus --diff .

      - name: Codespell check
        run: uv run codespell . --skip=*.lock

      - name: Bandit security check
        run: uv run bandit -r utils example -ll --skip B101

      - name: Pydocstyle check
        run: uv run pydocstyle utils example

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term --cov-report=xml

      - name: Generate coverage badge
        uses: tj-actions/coverage-badge-py@v2
        with:
          working-directory: .
          output: coverage.svg
          overwrite: true

      - name: Commit badge
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update coverage badge"
          file_pattern: coverage.svg
