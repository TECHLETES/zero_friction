name: CI

on:
  pull_request:
    branches:
      - main
      - staging
    paths-ignore:
      - 'coverage.svg'
  push:
    branches:
      - main
      - staging
    paths-ignore:
      - 'coverage.svg'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read

jobs:
  changed-files:
    name: Detect changed files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      all: ${{ steps.filter.outputs.all }}
      python: ${{ steps.filter.outputs.python }}
      pre_commit: ${{ steps.filter.outputs.pre_commit }}
      devcontainer: ${{ steps.filter.outputs.devcontainer }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Filter changed files
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            all:
              - '.github/workflows/**'
              - '.pre-commit-config.yaml'
              - '.secret.baseline'
              - 'pyproject.toml'
              - 'scripts/**'
              - 'uv.lock'
            python:
              - 'example/**'
              - 'tests/**'
              - 'utils/**'
            pre_commit:
              - '.pre-commit-config.yaml'
              - '.secret.baseline'
              - 'scripts/hooks/**'
            devcontainer:
              - '.devcontainer/**'

  pre-commit:
    uses: ./.github/workflows/test-pre-commit.yml
    if: ${{ needs.changed-files.outputs.all == 'true' || needs.changed-files.outputs.python == 'true' || needs.changed-files.outputs.pre_commit == 'true' }}
    needs: changed-files

  test-python:
    uses: ./.github/workflows/test-python.yml
    if: ${{ needs.changed-files.outputs.all == 'true' || needs.changed-files.outputs.python == 'true' }}
    needs: changed-files
    secrets: inherit

  devcontainer-smoke:
    if: ${{ needs.changed-files.outputs.all == 'true' || needs.changed-files.outputs.devcontainer == 'true' }}
    needs: changed-files
    uses: ./.github/workflows/test-devcontainer.yml
    secrets: inherit
