source:
  repository: TECHLETES/python_template
  branch: main

target:
  # Default Techletes integration branch.
  # Change this to main when the repository does not use staging.
  branch: staging
  sync_branch: chore/template-sync

# Explicit allowlist of generic tooling owned by the Python template.
#
# Keep application code, dependencies, deployment configuration,
# documentation and lockfiles target-owned unless a repository deliberately
# opts into synchronizing them.
paths:
  # Github configuration and workflows
  - .github/workflows/template-sync.yml
  - .github/workflows/reusable-reconcile-template-sync-branch.yml
  - .github/workflows/staging-main-check.yml
  - .github/workflows/ci.yml
  - .github/workflows/test-devcontainer.yml
  - .github/workflows/test-pre-commit.yml
  - .github/workflows/test-python.yml
  - .github/workflows/labeler.yml
  - .github/ISSUE_TEMPLATE/**
  - .github/dependabot.yml
  - .github/pull_request_template.md

  # Development environment.
  - .devcontainer/**

  # Python and repository tooling.
  - .pre-commit-config.yaml
  - .python-version
  - .editorconfig
  - .gitattributes
  - pyproject.toml

  # Shared quality and security helpers.
  - scripts/hooks/**
  - scripts/adopt-template.py

  - docs/*.md
