source:
  repository: TECHLETES/python_template
  branch: main

target:
  branch: main
  sync_branch: chore/template-sync

# Copied from TECHLETES/python_template/main:.template-sync.yml on 2026-07-29.
#
# The two workflows below are intentionally target-owned: this caller contains
# this repository's branch values, and reconciliation is implemented locally
# because the referenced reusable reconciliation workflow does not exist in
# the current Python template.
paths:
  # GitHub configuration and workflows.
  - .github/workflows/staging-main-check.yml
  - .github/workflows/labeler.yml
  - .github/ISSUE_TEMPLATE/**
  - .github/dependabot.yml
  - .github/pull_request_template.md

  # Development environment.
  - .devcontainer/devcontainer.json
  - .devcontainer/Dockerfile
  - .devcontainer/post-create.sh
  - .devcontainer/post-attach.sh
  - .devcontainer/dev-services.sh

  # Python and repository tooling.
  - .pre-commit-config.yaml
  - .python-version
  - .editorconfig
  - .gitattributes

  # Shared quality and security helpers.
  - scripts/hooks/**
