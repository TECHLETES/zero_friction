# This file is only used for tool configuration. 
# Dependency locking is handled via pip-tools using requirements.in / requirements.txt.

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-basic-template"
version = "0.1.0"
description = "A basic Python project template"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pre-commit",
    "detect-secrets", 
    "nbstripout",
    "pytest",
    "pytest-cov",
    "black",
    "mypy",
    "ruff",
    "beartype",
    "pytest-beartype",
    "pip-tools",  # for managing requirements.in/txt
]

[project.urls]
Homepage = "https://github.com/thom-techlete/python_basic_template"
Repository = "https://github.com/thom-techlete/python_basic_template"
Issues = "https://github.com/thom-techlete/python_basic_template/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["utils*", "example*"]
exclude = ["tests*"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=utils",
    "--cov=example",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--beartype-packages=utils,example",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["utils", "example"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/__pycache__/*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError", 
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
show_error_codes = true
warn_unused_ignores = true
show_column_numbers = true
pretty = true
exclude = [
  "migrations",  # if Django/SQLAlchemy used
  "notebooks",   # if you sync with Jupytext
]
plugins = []

[tool.ruff]
target-version = "py311"
line-length = 88
fix = true
respect-gitignore = true
extend-exclude = ["migrations"]

# Enable popular rule sets
select = [
  "E",  # pycodestyle
  "F",  # pyflakes
  "I",  # isort
  "B",  # bugbear
  "UP", # pyupgrade
]

# Rules to ignore (common ones)
ignore = [
  "B008",  # Do not perform function calls in argument defaults
  "E501",  # Line too long (Black handles this)
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.bandit]
exclude_dirs = ["tests", "venv"]
skips = ["B101", "B601"]
