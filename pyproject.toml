[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-basic-template"
version = "0.1.0"
description = "A basic Python project template with full DevOps tooling support."
readme = "README.md"
requires-python = ">=3.12,<4.0"
keywords = ["devops", "template", "python"]
license = {text = "MIT"}
authors = [
    {name = "Thom Ezechiels", email = "thom@techletes.ai"},
]
maintainers = [
  { name = "Techletes DevOps Team", email = "dev@techletes.ai" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

# Add project dependencies here. pip-tools will read them from here, do not use a requirements file!
dependencies = [
  "flask>=2.2.0,<3.0.0", # Example dependency, replace with your own
  "requests"
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "detect-secrets",
    "nbstripout",
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "mypy",
    "ruff",
    "beartype",
    "pytest-beartype",
    "pip-audit>=2.9.0",
    "pip-tools",  # for managing requirement*.txt
    "rich",
]

# Add your extra dependencies here. These are custom packages not on PyPI.
# For example the 'zero-friction' package that needs to be installed via GitHub.
extra = [
  # "zero-friction @ git+https://github.com/TECHLETES/zero_friction.git@main"
]

[project.urls]
Homepage = "https://github.com/TECHLETES/python_basic_template"
Repository = "https://github.com/TECHLETES/python_basic_template"
Issues = "https://github.com/TECHLETES/python_basic_template/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["utils*", "example*"]
exclude = ["tests*"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=utils",
    "--cov=example",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--beartype-packages=utils,example",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]

[tool.coverage.run]
source = ["utils", "example"]
omit = [
    "*/__pycache__/*",
    "*/tests/*",
    "*/example/*",
    "*/.venv/*",
    "*/venv/*",
    "*/__init__.py",
    "setup.py",
    # Add any other files you want to exclude from test coverage
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "except ImportError",
    "pass",
]

[tool.mypy]
python_version = "3.12"

# ignore_missing_imports for third-party libs without type hints
ignore_missing_imports = true
follow_imports = "silent"

# strictness settings - adjust as needed
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
no_implicit_optional = true
allow_redefinition = true
show_error_codes = true
show_column_numbers = true
pretty = true
warn_unused_configs = true

# enforce typing on own code
disallow_untyped_defs = true
disallow_incomplete_defs = true

exclude = [
  "migrations",
  "notebooks",
  "tests",
]
plugins = []

# Loosen rules for test and script files
[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false

[tool.ruff]
target-version = "py311"
line-length = 88
fix = true
respect-gitignore = true
extend-exclude = ["migrations"]
lint.dummy-variable-rgx = "^_|^__|^pytest$"

# Enable popular rule sets
lint.select = [
  "E",  # pycodestyle
  "F",  # pyflakes
  "I",  # isort
  "B",  # bugbear
  "UP", # pyupgrade
]

# Rules to ignore (common ones)
lint.ignore = [
  "B008",  # Do not perform function calls in argument defaults
  "E501",  # Line too long (Black handles this)
]

[tool.bandit]
exclude_dirs = ["tests", "venv"]
skips = ["B101", "B601"]
