[build-system]
requires = ["setuptools>=69", "wheel", "pip>=26.0,<27.0.0", "uv>=0.9.25,<1.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-friction"
version = "0.1.0"
description = "Unified Python SDK for the Zero Friction APIs."
readme = "README.md"
requires-python = ">=3.9,<4.0"
keywords = ["python", "sdk", "zero friction", "api client"]
authors = [
  { name = "Dominic Istha", email = "dominic@techletes.ai" },
  { name = "Thom Ezechiels", email = "thom@techletes.ai" },
]
maintainers = [
  { name = "Dominic Istha", email = "dominic@techletes.ai" },
  { name = "Techletes DevOps Team", email = "dev@techletes.ai" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pandas>=2.2.0,<3.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
  "ratelimit>=2.2.1,<3.0.0",
  "pydantic>=2",
  "python-dateutil>=2.8.2",
  "requests>=2.32.4,<3.0.0",
  "typing-extensions>=4.7.1",
  "urllib3>=2.6.0,<3.0.0",
]

[dependency-groups]
dev = [
  "bandit>=1.7.0,<2.0.0",
  "beartype>=0.22.0,<1.0.0",
  "black>=24.0.0,<25.12.0; python_version < '3.10'",
  "black>=25.12.0,<27.0.0; python_version >= '3.10'",
  "codespell>=2.2.0,<3.0.0",
  "detect-secrets>=1.5.0,<2.0.0",
  "genbadge[coverage]>=1.1.0,<2.0.0",
  "ipykernel>=6.29.0,<7.0.0",
  "mypy>=1.19.0,<2.0.0",
  "nbstripout>=0.8.0,<1.0.0",
  "pip-audit>=2.10.0,<3.0.0; python_version >= '3.10'",
  "pre-commit>=4.5.0,<5.0.0; python_version >= '3.10'",
  "pydocstyle>=6.3.0,<7.0.0",
  "pytest>=9.0.3,<10.0.0; python_version >= '3.10'",
  "pytest-beartype>=0.2.0,<1.0.0",
  "pytest-cov>=7.0.0,<8.0.0",
  "pyupgrade>=3.15.0,<4.0.0",
  "rich>=14.2.0,<15.0.0",
  "ruff>=0.14.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/TECHLETES/zero_friction"
Repository = "https://github.com/TECHLETES/zero_friction"
Issues = "https://github.com/TECHLETES/zero_friction/issues"

[tool.setuptools]

[tool.setuptools.package-dir]
"" = "."
attachments_client = "sdk/attachments_client/attachments_client"
billing_client = "sdk/billing_client/billing_client"
communication_client = "sdk/communication_client/communication_client"
configuration_client = "sdk/configuration_client/configuration_client"
forecasting_client = "sdk/forecasting_client/forecasting_client"
masterdata_client = "sdk/masterdata_client/masterdata_client"
metering_client = "sdk/metering_client/metering_client"
regionalregulations_client = "sdk/regionalregulations_client/regionalregulations_client"

[tool.setuptools.packages.find]
where = [
  ".",
  "sdk/attachments_client",
  "sdk/billing_client",
  "sdk/communication_client",
  "sdk/configuration_client",
  "sdk/forecasting_client",
  "sdk/masterdata_client",
  "sdk/metering_client",
  "sdk/regionalregulations_client",
]
include = [
  "zero_friction*",
  "attachments_client*",
  "billing_client*",
  "communication_client*",
  "configuration_client*",
  "forecasting_client*",
  "masterdata_client*",
  "metering_client*",
  "regionalregulations_client*",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest]
minversion = "9.0.3"
addopts = [
  "--strict-markers",
  "--strict-config",
  "--cov=zero_friction",
  "--cov-report=term-missing",
  "--cov-report=html",
  "--cov-report=xml",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]

[tool.coverage.run]
source = ["zero_friction"]
omit = ["*/__pycache__/*", "*/tests/*", "*/.venv/*", "*/venv/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "class .*\\bProtocol\\):",
  "@(abc\\.)?abstractmethod",
  "except ImportError",
  "pass",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
no_implicit_optional = true
allow_redefinition = true
show_column_numbers = true
pretty = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
files = ["zero_friction"]
exclude = "(^|/)(migrations|notebooks|tests|sdk)/"
plugins = []

[tool.ruff]
target-version = "py39"
line-length = 88
fix = true
respect-gitignore = true
extend-exclude = ["migrations", "sdk"]
lint.dummy-variable-rgx = "^_|^__|^pytest$"
lint.select = ["E", "F", "I", "B", "UP"]
lint.ignore = ["B008", "E501"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "sdk"]
skips = ["B101", "B601"]

[tool.pip-audit]
ignore = []

[tool.detect-secrets]
# Regular expressions matched against paths ignored by the shared helper and
# the pre-commit detect-secrets check.
exclude_files = [
  "^coverage.svg$",
  "^tests/",
  "^sdk/",

]

[tool.uv]
required-version = ">=0.9.25,<1.0.0"
