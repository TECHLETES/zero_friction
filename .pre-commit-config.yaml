repos:
  - repo: local
    hooks:
      # Prevent manual requirements.txt files
      - id: verify-prod-lockfile
        name: Verify production lockfile is up-to-date
        entry: ./scripts/verify-lockfile.sh
        args: ["requirements.txt"]
        language: python
        files: ^requirements\.txt$
        additional_dependencies: [pip-tools]

      - id: verify-dev-lockfile
        name: Verify development lockfile is up-to-date
        entry: ./scripts/verify-lockfile.sh
        args: ["requirements-dev.txt"]
        language: python
        files: ^requirements-dev\.txt$
        additional_dependencies: [pip-tools]

      # Strip notebook outputs
      - id: nbstripout-autoadd
        name: nbstripout (auto-add notebooks)
        entry: scripts/hooks/nbstripout-autoadd.sh
        language: python
        types: [jupyter]
        additional_dependencies: [nbstripout]

      # Auto-format Python code with Black
      - id: black-autoformat
        name: Auto-format Python with Black
        entry: scripts/hooks/black-autoformat.sh
        language: python
        additional_dependencies: [black]
        types: [python]

  # Dependency vulnerability scanning
  - repo: https://github.com/pypa/pip-audit
    rev: v2.9.0
    hooks:
      - id: pip-audit
        args: ['--progress-spinner', 'off']
        stages: [pre-commit]

  # Secrets scanning
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: ^tests/

  # Notebook/text sync
  - repo: https://github.com/mwouts/jupytext
    rev: v1.17.2
    hooks:
      - id: jupytext
        args: [--sync]
        require_serial: true

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.17.1
    hooks:
      - id: mypy
        name: Type check with mypy
        args: ["--config-file=pyproject.toml"]


  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.8
    hooks:
      - id: ruff
        name: Ruff (linting + extra isort + rules)
        args: [--fix]
        types: [python]
  
