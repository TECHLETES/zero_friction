repos:
  - repo: local
    hooks:
      # Strip notebook outputs
      - id: nbstripout-autoadd
        name: nbstripout (auto-add notebooks)
        entry: uv run scripts/hooks/nbstripout-autoadd.sh
        language: system
        types: [jupyter]

      # Auto-format Python code with Black
      - id: black-autoformat
        name: Auto-format Python with Black
        entry: uv run scripts/hooks/black-autoformat.sh
        language: system
        types: [python]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-json
      - id: check-symlinks
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key
      - id: pretty-format-json
        args: ["--autofix"]
        exclude: \.ipynb$

  # Dependency vulnerability scanning with uv.lock
  - repo: https://github.com/pypa/pip-audit
    rev: v2.10.0
    hooks:
      - id: pip-audit
        args: ["--progress-spinner", "off", "--desc", "--ignore", "CVE-2026-1703"]
        stages: [pre-commit]

  # Secrets scanning
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: ^tests/

  # Notebook/text sync with jupytext
  - repo: https://github.com/mwouts/jupytext
    rev: v1.19.1
    hooks:
      - id: jupytext
        args: [--sync]
        require_serial: true

  # Type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        name: Type check with mypy
        args: ["--config-file=pyproject.toml"]

  # Linting and formatting with ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff
        name: Ruff (linting + import sorting + formatting)
        args: [--fix]
        types: [python]

  # Testing with pytest (locally managed by uv)
  - repo: local
    hooks:
      - id: pytest
        name: Run pytest with coverage
        entry: uv run pytest --cov --cov-fail-under=80 --beartype-packages=utils,example
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
