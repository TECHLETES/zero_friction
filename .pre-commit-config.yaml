  #       stages: [pre-commit]

  - repo: local
    hooks:
      - id: pytest
        name: Run pytest with coverage & beartype
        entry: bash scripts/hooks/precommit_pytest.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

