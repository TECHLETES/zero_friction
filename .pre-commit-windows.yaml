repos:
  - repo: local
    hooks:
      - id: verify-prod-lockfile
        name: Verify prod lockfile (Windows)
        entry: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\\hooks\\verify-prod-lockfile.ps1
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: verify-dev-lockfile
        name: Verify dev lockfile (Windows)
        entry: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\\hooks\\verify-dev-lockfile.ps1
        language: system
        pass_filenames: false
        stages: [pre-commit]

  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black

  - repo: https://github.com/pypa/pip-audit
    rev: v2.9.0
    hooks:
      - id: pip-audit
        args: ['--progress-spinner', 'off']
        stages: [pre-commit]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: ^tests/

  - repo: https://github.com/mwouts/jupytext
    rev: v1.17.2
    hooks:
      - id: jupytext
        args: [--sync]
        require_serial: true

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.17.1
    hooks:
      - id: mypy
        args: ["--config-file=pyproject.toml"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.8
    hooks:
      - id: ruff
        args: [--fix]
        types: [python]

  - repo: local
    hooks:
      - id: pytest
        name: Run pytest with coverage & beartype
        entry: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\\hooks\\precommit_pytest.ps1
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
